# x3f example configuration.
# Copy to x3f.yaml and adjust. x3f.yaml is git-ignored.
#
# Secrets (GitHub token, Telegram bot token) do NOT belong here;
# they are read from environment variables.

# Optional: Telegram message when a node's status changes. The bot token is
# read from the environment variable X3F_TELEGRAM_BOT_TOKEN, never from here.
# telegram:
#   chat_id: "-1001234567890"   # numeric chat ID, or "@channelname"
#   min_level: warn             # warn (default) or crit
#   remind_every: 24h           # reminder while a node stays red, 0 = never

# Optional: security advisories that do not apply to your setup. They no
# longer count for the status but are still listed as a note. reason is
# required; from the expires date (YYYY-MM-DD) on, the advisory counts again.
# Nodes can have their own ignore_advisories list as well.
# ignore_advisories:
#   - id: GHSA-v5gq-r843-8f73
#     reason: "private networks only; we run mainnet"
#     expires: 2027-03-01

nodes:
  - name: mainnet-1
    # Optional: node type. ethereum (the default) is an execution client
    # plus a consensus client.
    # type: ethereum
    # Execution client JSON-RPC (Geth, Reth, Nethermind, Erigon, Besu, Ethrex)
    execution_url: http://localhost:8545
    # Consensus client beacon API (Lighthouse, Prysm, Teku, Nimbus, Lodestar, Grandine)
    beacon_url: http://localhost:5052
    # Optional: expected network (mainnet, sepolia, hoodi). x3f detects the
    # network anyway; if this is set, a node on another network is critical.
    network: mainnet

  # An Aztec node (version and security advisories; see "Aztec nodes" in
  # the README). Its L1 is either an Ethereum node of this config (l1) or
  # a provider endpoint (l1_url); set exactly one of them.
  # - name: aztec-1
  #   type: aztec
  #   url: http://localhost:8080      # the node's JSON-RPC endpoint
  #   l1: mainnet-1
  #   # l1_url: https://eth.example.com/v3/<key>
