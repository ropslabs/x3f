# x3f fork schedule: which network upgrades are active, scheduled or
# postponed on each network, and which client releases support them.
#
# Rules for this file (see CLAUDE.md and internal/forks/SOURCES.md):
# - Dates, epochs, timestamps and client versions come only from official
#   sources: the Ethereum Foundation blog, ethereum/pm, the specs. Every fork
#   lists its sources.
# - The eth-clients/{mainnet,sepolia,hoodi} network configs are a cross-check
#   only. Deviations are reported, never adopted automatically. Last check:
#   2026-11-24, no deviations (see SOURCES.md).
# - x3f validates on load that every timestamp equals
#   genesis_time + epoch * 32 slots * 12 s, which catches typos.
#
# min_versions: the releases an announcement lists for a fork. Older releases
# cannot follow the chain once the fork is active.
# Postponed forks keep their former schedule. scheduled_in / removed_in name
# the releases that contained the old schedule and the first ones that
# removed it again.
#
# Ethrex is listed from the 2026 announcements on; the Fusaka announcements
# (2025) have no Ethrex release.

